name: Actualizar datos de matrícula

on:
  schedule:
    # Todos los días a las 6:17 a. m. hora de Costa Rica (12:17 UTC)
    - cron: "17 12 * * *"
  workflow_dispatch:   # botón "Run workflow" para actualizar a mano

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar librería de cifrado
        run: pip install cryptography

      - name: Bajar respuestas de LimeSurvey y generar archivos
        env:
          LS_URL: ${{ secrets.LS_URL }}
          LS_USER: ${{ secrets.LS_USER }}
          LS_PASSWORD: ${{ secrets.LS_PASSWORD }}
          CONTACTOS_PASSWORD: ${{ secrets.CONTACTOS_PASSWORD }}
        run: python scripts/fetch_data.py

      - name: Guardar cambios
        run: |
          git config user.name  "actualizador-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          [ -f contactos.html ] && git add contactos.html || true
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar datos de matrícula"
            git push
          fi
