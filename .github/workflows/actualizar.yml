name: Actualizar datos de matrícula

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bajar respuestas de LimeSurvey y generar archivos
        env:
          LS_URL: ${{ secrets.LS_URL }}
          LS_USER: ${{ secrets.LS_USER }}
          LS_PASSWORD: ${{ secrets.LS_PASSWORD }}
        run: python scripts/fetch_data.py

      - name: Guardar cambios
        run: |
          git config user.name  "actualizador-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add data/summary.json data/respuestas.csv
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualizar datos de matrícula"
            git push
          fi
