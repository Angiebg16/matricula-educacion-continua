<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrícula – Educación Continua en Estadística</title>
<style>
  :root{
    --ink:#1b2733; --muted:#5d6b78; --line:#dde3ea; --bg:#f5f7fa; --card:#fff;
    --brand:#0b5394; --brand-soft:#cfe2f3;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 48px}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:24px}
  h1{margin:0;font-size:2.4rem;letter-spacing:-.02em}
  .sub{color:var(--muted);margin-top:2px}
  .side{text-align:right}
  .btn{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:8px}
  .btn:hover{background:#094170}
  .updated{margin-top:8px;font-size:.88rem;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:20px}
  .card h2{margin:0 0 14px;font-size:1.05rem}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
  .kpi .n{font-size:2.2rem;font-weight:700;color:var(--brand);line-height:1.1}
  .kpi .l{color:var(--muted);font-size:.9rem}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
  th{font-size:.85rem;color:var(--muted);font-weight:600}
  td.num,th.num{text-align:right;width:110px}
  tr:last-child td{border-bottom:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px}
  .bar-row{display:grid;grid-template-columns:minmax(120px,40%) 1fr 36px;gap:10px;align-items:center;margin:7px 0;font-size:.92rem}
  .bar-row .lab{overflow-wrap:anywhere}
  .track{background:var(--brand-soft);border-radius:4px;height:14px;overflow:hidden}
  .fill{background:var(--brand);height:100%;border-radius:4px}
  .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .empty{color:var(--muted);font-style:italic}
  svg{width:100%;height:auto;display:block}
  .note{font-size:.85rem;color:var(--muted);margin-top:8px}
  @media (max-width:520px){ .grid{grid-template-columns:1fr} h1{font-size:1.9rem} .side{text-align:left} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Matrícula</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="side">
      <a class="btn" href="data/respuestas.csv" download="respuestas.csv">Descargar datos (CSV)</a>
      <div class="updated">Última actualización: <strong id="updated">—</strong></div>
    </div>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="n" id="total">–</div><div class="l">personas matriculadas</div></div>
    <div class="kpi"><div class="n" id="ncursos">–</div><div class="l">cursos con matrícula</div></div>
    <div class="kpi"><div class="n" id="incompletas">–</div><div class="l">formularios sin terminar</div></div>
  </div>

  <div class="card">
    <h2>Matrícula por curso</h2>
    <table>
      <thead><tr><th>Curso</th><th class="num">Matriculados</th><th class="num">% del total</th></tr></thead>
      <tbody id="courses"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Matrículas por día (acumulado)</h2>
    <div id="daily"></div>
  </div>

  <div class="grid">
    <div class="card"><h2>Máximo grado académico</h2><div id="grado"></div></div>
    <div class="card"><h2>Horario preferido</h2><div id="horario"></div></div>
    <div class="card"><h2>Provincia</h2><div id="provincia"></div></div>
  </div>

  <p class="note" id="note"></p>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function bars(el, items){
  if(!items || !items.length){ el.innerHTML = '<div class="empty">Aún no hay datos.</div>'; return; }
  const max = Math.max(...items.map(i => i.value));
  el.innerHTML = items.map(i =>
    `<div class="bar-row"><div class="lab">${esc(i.label)}</div>
     <div class="track"><div class="fill" style="width:${(100*i.value/max).toFixed(1)}%"></div></div>
     <div class="val">${i.value}</div></div>`).join('');
}

function dailyChart(el, daily){
  if(!daily || !daily.length){ el.innerHTML = '<div class="empty">Aún no hay datos.</div>'; return; }
  const W=900, H=240, L=40, R=12, T=14, B=34;
  const maxY = Math.max(...daily.map(d => d.acumulado));
  const n = daily.length, bw = (W-L-R)/n;
  const y = v => T + (H-T-B) * (1 - v/maxY);
  let g = '';
  [0, .5, 1].forEach(f => {
    const v = Math.round(maxY*f), yy = y(v);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#dde3ea"/>
          <text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="12" fill="#5d6b78">${v}</text>`;
  });
  daily.forEach((d,i) => {
    const x = L + i*bw + bw*0.15, w = bw*0.7, h = (H-T-B) * d.acumulado/maxY;
    g += `<rect x="${x}" y="${y(d.acumulado)}" width="${w}" height="${h}" rx="3" fill="#0b5394"><title>${d.date}: ${d.acumulado} en total (${d.nuevos} nuevos)</title></rect>`;
    const every = Math.ceil(n/8);
    if(i % every === 0 || i === n-1){
      const [yy,mm,dd] = d.date.split('-');
      g += `<text x="${x+w/2}" y="${H-12}" text-anchor="middle" font-size="12" fill="#5d6b78">${dd}/${mm}</text>`;
    }
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Matrículas acumuladas por día">${g}</svg>`;
}

function fmtDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleString('es-CR', {day:'2-digit', month:'2-digit', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true, timeZone:'America/Costa_Rica'});
}

fetch('data/summary.json?t=' + Date.now())
  .then(r => r.json())
  .then(s => {
    $('title').textContent = s.title || 'Matrícula';
    $('subtitle').textContent = s.subtitle || '';
    document.title = (s.title ? s.title + ' – ' : '') + (s.subtitle || 'Matrícula');
    $('updated').textContent = fmtDate(s.updated_at);
    $('total').textContent = s.total;
    $('ncursos').textContent = s.courses.length;
    $('incompletas').textContent = s.incompletas;
    $('courses').innerHTML = s.courses.length
      ? s.courses.map(c => `<tr><td>${esc(c.label)}</td><td class="num"><strong>${c.value}</strong></td><td class="num">${c.pct}%</td></tr>`).join('')
      : '<tr><td colspan="3" class="empty">Aún no hay matrículas.</td></tr>';
    dailyChart($('daily'), s.daily);
    bars($('grado'), s.grado);
    bars($('horario'), s.horario);
    bars($('provincia'), s.provincia);
    $('note').textContent = s.personal_data_public
      ? 'El archivo descargable incluye datos personales.';
  })
  .catch(() => { $('updated').textContent = 'no se pudo cargar'; });
</script>
</body>
</html>
